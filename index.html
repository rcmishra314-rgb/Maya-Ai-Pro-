<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya AI Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0c1b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #d1c4e9;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            max-width: 400px;
        }
        .avatar-box {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ab47bc;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(171, 71, 188, 0.5);
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .title {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: #b39ddb;
            margin-bottom: 30px;
            text-align: center;
        }
        .mic-btn {
            background: linear-gradient(135deg, #ab47bc, #7b1fa2);
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(123, 31, 162, 0.6);
            transition: transform 0.2s;
        }
        .mic-btn:active {
            transform: scale(0.95);
        }
        .mic-btn svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }
        .chat-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            min-height: 60px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 14px;
            color: #e1bee7;
        }
        .input-area {
            display: flex;
            width: 100%;
            max-width: 400px;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            outline: none;
        }
        .input-area button {
            background: #7b1fa2;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area button svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>MAYA AI PRO (Bluetooth Ready)</span>
    </div>

    <div class="container">
        <div class="avatar-box">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&h=300&fit=crop&crop=faces" alt="Maya Avatar">
        </div>
        <div class="title">Hi, I'm Maya</div>
        <div class="subtitle">Bluetooth mode active. Tap mic to speak.</div>

        <button class="mic-btn" id="micBtn" onclick="startListening()">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.39-.9.9 0 3.03-2.47 5.5-5.5 5.5s-5.5-2.47-5.5-5.5c0-.51-.41-.9-.9-9s-.9.39-.9.9c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92 0-.51-.41-.9-.9-.9z"/>
            </svg>
        </button>
    </div>

    <div class="chat-box" id="chatBox">Maya: Bluetooth connected. Main sun rahi hoon!</div>

    <div class="input-area">
        <input type="text" id="textInput" placeholder="Type a message...">
        <button onclick="handleTextCommand()">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

    <script>
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 1.0;
                // यह सुनिश्चित करता है कि ब्लूटूथ इयरफोन पर आवाज साफ सुनाई दे
                window.speechSynthesis.speak(utterance);
            }
        }

        function processCommand(command) {
            const lowerCmd = command.toLowerCase();
            let responseText = "Main aapki baat samajh gayi, Boss!";

            if (lowerCmd.includes('youtube') || lowerCmd.includes('yuvtube')) {
                responseText = "Youtube khol rahi hoon.";
                speak(responseText);
                window.open('https://www.youtube.com', '_blank');
            } else if (lowerCmd.includes('whatsapp')) {
                responseText = "WhatsApp khol rahi hoon.";
                speak(responseText);
                window.open('https://wa.me/', '_blank');
            } else if (lowerCmd.includes('call')) {
                responseText = "Dialer khol rahi hoon.";
                speak(responseText);
                window.open('tel:', '_blank');
            } else {
                responseText = "Aapne kaha: " + command + ". Aur bataiye, bluetooth par kya madad karun?";
                speak(responseText);
            }

            document.getElementById('chatBox').innerText = "Maya: " + responseText;
        }

        function startListening() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Aapka browser voice recognition support nahi karta.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            document.getElementById('chatBox').innerText = "Maya: Bluetooth mic active hai, boliye...";
            speak("Boliye, sun rahi hoon!");

            try {
                recognition.start();
            } catch(e) {
                console.log("Recognition error: ", e);
            }

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                document.getElementById('textInput').value = speechResult;
                processCommand(speechResult);
            };

            recognition.onerror = function(event) {
                document.getElementById('chatBox').innerText = "Maya: Awaz sunai nahi di, bluetooth mic check karein.";
            };
        }

        function handleTextCommand() {
            const input = document.getElementById('textInput');
            const text = input.value.trim();
            if (text !== "") {
                processCommand(text);
                input.value = "";
            }
        }
    </script>
</body>
</html>
