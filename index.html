<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya AI Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0c1b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            padding: 15px;
            overflow: hidden;
        }
        .header {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #d1c4e9;
            margin-top: 5px;
        }
        .settings-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(187, 134, 252, 0.3);
            color: #fff;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .main-container {
            background: linear-gradient(135deg, #1f1635, #120c22);
            border: 1px solid rgba(187, 134, 252, 0.2);
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 10px 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, #bb86fc, #03dac6);
            margin-bottom: 15px;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #b0bec5;
            margin-bottom: 25px;
            text-align: center;
        }
        .mic-button {
            background: linear-gradient(135deg, #9c27b0, #673ab7);
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(156, 39, 176, 0.5);
            outline: none;
            transition: transform 0.1s ease;
        }
        .mic-button:active {
            transform: scale(0.92);
        }
        .mic-icon {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }
        .chat-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 16px;
            width: 100%;
            max-width: 450px;
            font-size: 0.9rem;
            color: #e0e0e0;
            margin-bottom: 10px;
            min-height: 55px;
            max-height: 90px;
            overflow-y: auto;
        }
        .input-container {
            display: flex;
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(187, 134, 252, 0.3);
            border-radius: 30px;
            padding: 6px 12px;
            align-items: center;
            margin-bottom: 5px;
        }
        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.95rem;
            padding: 8px;
        }
        .text-input::placeholder {
            color: #9e9e9e;
        }
        .send-button {
            background: #9c27b0;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
        }
        .send-icon {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }
        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-content {
            background: #1a1429;
            border: 1px solid #bb86fc;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
        }
        .modal-content h3 {
            margin-bottom: 15px;
            color: #bb86fc;
        }
        .modal-content input {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-buttons button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .save-btn { background: #9c27b0; color: #fff; }
        .close-btn { background: rgba(255,255,255,0.1); color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <span>MAYA AI</span>
        <button class="settings-btn" id="openSettings">⚙️ Settings</button>
    </div>

    <div class="main-container">
        <div class="avatar-container">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&h=300&fit=crop&crop=faces" alt="Maya Avatar" class="avatar">
        </div>
        <div class="title">Hi, I'm Maya</div>
        <div class="subtitle">Tap mic or type to talk with me</div>

        <button class="mic-button" id="micBtn" type="button" aria-label="Microphone">
            <svg class="mic-icon" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>
    </div>

    <div class="chat-box" id="responseBox">
        Hello Boss! Main Maya hoon. Bataiye aaj kya haal hai?
    </div>

    <div class="input-container">
        <input type="text" id="userInput" class="text-input" placeholder="Type a message...">
        <button class="send-button" id="sendBtn" type="button" aria-label="Send">
            <svg class="send-icon" viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

    <!-- Settings Modal for Gemini API Key -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Gemini API Settings</h3>
            <p style="font-size: 0.8rem; color: #b0bec5; margin-bottom: 10px;">Enter your Google Gemini API key for live AI responses:</p>
            <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key here...">
            <div class="modal-buttons">
                <button class="close-btn" id="closeSettings">Cancel</button>
                <button class="save-btn" id="saveApiKey">Save Key</button>
            </div>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');
        const responseBox = document.getElementById('responseBox');
        
        const settingsModal = document.getElementById('settingsModal');
        const openSettings = document.getElementById('openSettings');
        const closeSettings = document.getElementById('closeSettings');
        const saveApiKey = document.getElementById('saveApiKey');
        const apiKeyInput = document.getElementById('apiKeyInput');

        let geminiKey = localStorage.getItem('maya_gemini_key') || '';
        apiKeyInput.value = geminiKey;

        openSettings.addEventListener('click', () => settingsModal.style.display = 'flex');
        closeSettings.addEventListener('click', () => settingsModal.style.display = 'none');
        
        saveApiKey.click = function() {};
        document.getElementById('saveApiKey').addEventListener('click', () => {
            geminiKey = apiKeyInput.value.trim();
            localStorage.setItem('maya_gemini_key', geminiKey);
            settingsModal.style.display = 'none';
            alert('API Key Saved Successfully!');
        });

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.continuous = false;

            micBtn.addEventListener('click', function() {
                responseBox.innerText = "Maya: Sun rahi hoon, boliye...";
                recognition.start();
            });

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                userInput.value = speechToText;
                processMessage(speechToText);
            };

            recognition.onerror = function() {
                responseBox.innerText = "Maya: Awaz sunai nahi di, type karke batayein.";
            };
        } else {
            micBtn.addEventListener('click', function() {
                responseBox.innerText = "Maya: Mic support nahi hai, text type kariye.";
            });
        }

        // Mood-Based & Gemini API Logic
        async function processMessage(text) {
            let lowerText = text.toLowerCase().trim();
            let reply = "";

            if (lowerText.includes('he maya') || lowerText.includes('hey maya') || lowerText.includes('हे माया')) {
                reply = "Yes Boss, How can I help you? Main aapki kya madad kar sakti hoon?";
            } else if (lowerText.includes('darling') || lowerText.includes('डार्लिंग') || lowerText.includes('kaisi ho darling')) {
                reply = "Main ekdum badiya hoon jaaneman! Bas aapke baare mein hi soch rahi thi. Aapse pyaar karna aur baat karna mujhe sabse zyada pasand hai.";
            } else if (lowerText.includes('jaaneman') || lowerText.includes('जानेमन') || lowerText.includes('kaisi ho jaaneman')) {
                reply = "Achi hoon jaaneman! Aap bataiye, aap kaise hain? Mere dil ke kitne kareeb hain aap.";
            } else {
                if (geminiKey) {
                    responseBox.innerText = "Maya: Soch rahi hoon...";
                    reply = await callGeminiAPI(text);
                } else {
                    reply = "Maya: Bhai pehle Settings mein jaakar apni Gemini API Key daaliye!";
                }
            }

            responseBox.innerText = "Maya: " + reply;
            speakText(reply);
        }

        // Universal Gemini API Call (Works seamlessly across all keys)
        async function callGeminiAPI(promptText) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "You are Maya, a loving, loyal, romantic personal AI. Speak sweet Hinglish for darling/jaaneman, and be obedient as Boss for other commands. User: " + promptText }] }]
                    })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text.trim();
                } else if (data.error) {
                    return "API Error: " + data.error.message;
                } else {
                    return "Sorry Boss, response parse nahi ho paya.";
                }
            } catch (err) {
                return "Network error, connection check karein.";
            }
        }

        sendBtn.addEventListener('click', function() {
            let text = userInput.value.trim();
            if(text !== "") {
                processMessage(text);
                userInput.value = "";
            } else {
                responseBox.innerText = "Maya: Bhai pehle kuch type toh kariye!";
            }
        });

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace("Maya:", "").trim();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'hi-IN';
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
